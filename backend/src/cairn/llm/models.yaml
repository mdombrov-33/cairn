agent_names:
  - intent_router
  - scene_narrator
  - rules_lawyer
  - dialogue
  - scene_director_pre
  - scene_director_post
  - scene_summarizer
  - lore_keeper
  - companion_reflector
  - npc_builder
  - npc_builder_deepen
  - scene_builder
  - zone_seeder
  - recruiter
  - combat_resolver
  - enemy_ai
  - ally_ai

profiles:
  development:
    default:
      primary: ollama/qwen2.5:latest

tiers:
  # Every hosted account starts here: fast and economical, Luna everywhere.
  free:
    default:
      primary: openai/gpt-5.6-luna
      fallback: openai/gpt-5.6-terra

  # Terra is reserved for the player-facing and rare generation calls.
  plus:
    default:
      primary: openai/gpt-5.6-luna
      fallback: openai/gpt-5.6-terra
    agents:
      scene_narrator:
        primary: openai/gpt-5.6-terra
        fallback: openai/gpt-5.6-luna
      dialogue:
        primary: openai/gpt-5.6-terra
        fallback: openai/gpt-5.6-luna
      npc_builder_deepen:
        primary: openai/gpt-5.6-terra
        fallback: openai/gpt-5.6-luna
      scene_builder:
        primary: openai/gpt-5.6-terra
        fallback: openai/gpt-5.6-luna

  # Sol is deliberately rare: Pro narration, not every background or combat call.
  pro:
    default:
      primary: openai/gpt-5.6-luna
      fallback: openai/gpt-5.6-terra
    agents:
      scene_narrator:
        primary: openai/gpt-5.6-sol
        fallback: openai/gpt-5.6-terra
      dialogue:
        primary: openai/gpt-5.6-terra
        fallback: openai/gpt-5.6-luna
      npc_builder_deepen:
        primary: openai/gpt-5.6-terra
        fallback: openai/gpt-5.6-luna
      scene_builder:
        primary: openai/gpt-5.6-terra
        fallback: openai/gpt-5.6-luna
