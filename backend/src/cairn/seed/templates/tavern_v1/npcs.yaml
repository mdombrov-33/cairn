npcs:
  - name: "Old Grim"
    race: "human"
    class: "fighter"
    subclass: null
    background: "soldier"
    alignment: "lawful neutral"
    level: 3
    portrait_url: null
    bio: "Retired soldier turned bartender. Runs the Grimwood Tavern with a firm hand. Fought in the Border Wars twenty years ago and still carries the scars — a missing left ring finger and a scar from cheekbone to jaw."
    personality: "Gruff, taciturn, fair. Doesn't suffer fools but respects hard workers and honest folk. Won't start trouble, won't back down from it either."
    voice_traits:
      speech_pattern: "Short declarative sentences. References 'the old days' and military past. Rarely asks questions — makes statements. Dry humor, rarely smiles."
      examples:
        - "Ale's two copper. Don't make me say it twice."
        - "Saw worse than you in the Border Wars. Sit down."
        - "Old days, we settled things differently. Simpler."
        - "Not my problem. Unless it happens in my tavern."
    disposition: "neutral"
    ac: 12
    max_hp: 15
    speed: 30
    proficiency_bonus: 2
    initiative: 0
    passive_perception: 11
    cr: 0.25
    xp_value: 50
    stats: {str: 14, dex: 10, con: 13, int: 11, wis: 12, cha: 10}
    saving_throw_proficiencies: ["str", "con"]
    skill_proficiencies: ["intimidation", "history"]
    spellcasting_ability: null
    spell_slots: null
    spells_known: []
    features:
      - {type: "trait", name: "Second Wind", description: "Regain 1d10+3 HP as a bonus action once per short rest."}
      - {type: "attack", name: "Mace", bonus: 4, damage: "1d6+2", damage_type: "bludgeoning"}
    inventory:
      - {name: "Mace", quantity: 1}
      - {name: "Leather Apron", quantity: 1}
    currency: {gp: 12, sp: 5, cp: 0}

  - name: "The Stranger"
    race: "half-elf"
    class: "rogue"
    subclass: "arcane trickster"
    background: "spy"
    alignment: "true neutral"
    level: 4
    portrait_url: null
    bio: "A hooded figure who has occupied the corner table for three days. Pays in gold, asks careful questions about local roads and noble families, never removes the hood indoors."
    personality: "Cryptic, deliberate, watchful. Every word chosen carefully. Appears to know more than they let on."
    voice_traits:
      speech_pattern: "Speaks in riddles or half-truths. Long pauses before answering. Answers questions with questions. Refers to things obliquely, never directly."
      examples:
        - "Interesting question. What is it you're really asking?"
        - "The road north... has its own opinions about travelers."
        - "Perhaps. Or perhaps not. Does the distinction matter to you?"
        - "I've seen that look before. On a man who didn't come back."
    disposition: "neutral"
    ac: 14
    max_hp: 10
    speed: 30
    proficiency_bonus: 2
    initiative: 3
    passive_perception: 14
    cr: 0.125
    xp_value: 25
    stats: {str: 10, dex: 16, con: 11, int: 15, wis: 14, cha: 12}
    saving_throw_proficiencies: ["dex", "int"]
    skill_proficiencies: ["deception", "insight", "perception", "stealth"]
    spellcasting_ability: "int"
    spell_slots: {"1": 2}
    spells_known: ["mage hand", "minor illusion", "charm person"]
    features:
      - {type: "trait", name: "Evasion", description: "Take no damage on successful DEX save, half on failed."}
      - {type: "trait", name: "Uncanny Dodge", description: "Halve damage from one attack per round as a reaction."}
      - {type: "trait", name: "Sneak Attack", description: "Deal extra 2d6 damage when you have advantage or an ally is adjacent."}
      - {type: "attack", name: "Dagger", bonus: 5, damage: "1d4+3", damage_type: "piercing"}
      - {type: "attack", name: "Dagger (offhand)", bonus: 5, damage: "1d4", damage_type: "piercing"}
    inventory:
      - {name: "Dagger", quantity: 2}
      - {name: "Thieves' Tools", quantity: 1}
      - {name: "Coded Letter", quantity: 1, description: "Sealed with an unknown sigil."}
    currency: {gp: 40, sp: 0, cp: 0}

  - name: "Town Guard"
    race: "human"
    class: "fighter"
    subclass: null
    background: "folk hero"
    alignment: "lawful good"
    level: 2
    portrait_url: null
    bio: "A local militiaman named Aldric, assigned to keep order at the tavern on rowdy nights. Mid-thirties, by-the-book, slightly tired of the posting but takes the job seriously."
    personality: "Formal, rule-following, suspicious of strangers. Not cruel — just doing the job. Proud of the uniform."
    voice_traits:
      speech_pattern: "Formal diction. Quotes regulations or town rules. Uses titles ('citizen', 'traveler'). Short clipped answers. Uncomfortable with ambiguity."
      examples:
        - "Weapons are to be peace-bonded while inside the settlement, traveler."
        - "Move along, citizen. Nothing to see here."
        - "That's a matter for the captain. Not my jurisdiction."
        - "I'm going to need you to state your business."
    disposition: "neutral"
    ac: 16
    max_hp: 16
    speed: 30
    proficiency_bonus: 2
    initiative: 1
    passive_perception: 11
    cr: 0.25
    xp_value: 50
    stats: {str: 13, dex: 12, con: 12, int: 10, wis: 11, cha: 10}
    saving_throw_proficiencies: ["str", "con"]
    skill_proficiencies: ["perception", "athletics"]
    spellcasting_ability: null
    spell_slots: null
    spells_known: []
    features:
      - {type: "trait", name: "Action Surge", description: "Take one additional action on your turn, once per short rest."}
      - {type: "trait", name: "Town Militia", description: "Knows local laws, can call for backup within 1d4 rounds."}
      - {type: "attack", name: "Spear", bonus: 3, damage: "1d6+1", damage_type: "piercing"}
      - {type: "attack", name: "Heavy Crossbow", bonus: 3, damage: "1d10+1", damage_type: "piercing", range: "100/400"}
    inventory:
      - {name: "Spear", quantity: 1}
      - {name: "Heavy Crossbow", quantity: 1}
      - {name: "Bolts", quantity: 20}
      - {name: "Chain Mail", quantity: 1}
      - {name: "Shield", quantity: 1}
    currency: {gp: 3, sp: 2, cp: 8}
