<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cairn — Design Exploration</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=IM+Fell+English:ital@0;1&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:ital,wght@0,400;0,500;1,400&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; background: #0a0808; overflow: hidden; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #2a2020; border-radius: 2px; }
  textarea::placeholder, input::placeholder { opacity: 0.4; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

// ═══════════════════════════════════════════════════════════
// DIRECTION A — DARK GRIMOIRE
// Ink + aged gold + ember · Cinzel + IM Fell English
// ═══════════════════════════════════════════════════════════
const A = {
  bg:"#0d0b0f", bgDeep:"#0a0809", bgPanel:"#13100f",
  border:"#2e2318", borderGold:"#4a3820",
  gold:"#c9a84c", goldDim:"#7a6030", ember:"#b54a1e",
  parchment:"#e8d9b8", parchmentDim:"#9a8f78", ink:"#1e1812",
  dimText:"#7a7060", success:"#5a9e5a", danger:"#c04030",
};

function ParchmentDust() {
  const ref = useRef(null);
  useEffect(() => {
    const c = ref.current; if (!c) return;
    const ctx = c.getContext("2d");
    c.width = c.offsetWidth; c.height = c.offsetHeight;
    const pts = Array.from({length:60}, () => ({
      x: Math.random()*c.width, y: Math.random()*c.height,
      r: Math.random()*1.5+0.3,
      dx: (Math.random()-.5)*.12, dy: -Math.random()*.2-.05,
      op: Math.random()*.25+.05,
    }));
    let raf;
    const draw = () => {
      ctx.clearRect(0,0,c.width,c.height);
      pts.forEach(p => {
        ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(201,168,76,${p.op})`; ctx.fill();
        p.x+=p.dx; p.y+=p.dy;
        if(p.y<-2){p.y=c.height+2;p.x=Math.random()*c.width;}
        if(p.x<-2)p.x=c.width+2; if(p.x>c.width+2)p.x=-2;
      });
      raf=requestAnimationFrame(draw);
    };
    draw(); return ()=>cancelAnimationFrame(raf);
  }, []);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}} />;
}

function CornerRune({size=20,color=A.goldDim}) {
  return <svg width={size} height={size} viewBox="0 0 20 20" fill="none">
    <path d="M0 0 L8 0 L8 2 L2 2 L2 8 L0 8 Z" fill={color}/>
    <path d="M4 4 L6 4 L6 6 L4 6 Z" fill={color} opacity="0.5"/>
  </svg>;
}

function OrnamentDivider() {
  return <div style={{display:"flex",alignItems:"center",gap:8,margin:"10px 0"}}>
    <div style={{flex:1,height:1,background:`linear-gradient(to right,transparent,${A.borderGold})`}}/>
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none">
      <rect x="4" y="0" width="4" height="4" transform="rotate(45 6 2)" fill={A.goldDim}/>
      <rect x="4" y="8" width="4" height="4" transform="rotate(45 6 10)" fill={A.goldDim} opacity="0.4"/>
    </svg>
    <div style={{flex:1,height:1,background:`linear-gradient(to left,transparent,${A.borderGold})`}}/>
  </div>;
}

const TURNS_A_INIT = [
  {role:"dm", text:"The tavern at Grimwood Crossing reeks of pine smoke and old ale. Old Grim stands behind the bar, polishing the same tankard he's been polishing for an hour. He looks at you once — then looks away."},
  {role:"player", text:"I approach the bar and ask him quietly if he has any work that needs doing."},
  {role:"dm", text:"Grim sets the tankard down. Hard. Doesn't look up.\n\n\"Work.\" He says it like it's a confession. \"There's always work. Question is whether you'll still want it when you know what it is.\"\n\nHe reaches under the bar. Slides a folded piece of parchment across the wood."},
  {role:"check", stat:"PERSUASION", dc:14, rolled:null, modifier:3},
];

function ADicePrompt({check, onRoll}) {
  const [rolling,setRolling]=useState(false);
  const [face,setFace]=useState(20);
  const [result,setResult]=useState(null);
  const handleRoll=()=>{
    setRolling(true); let t=0;
    const iv=setInterval(()=>{
      setFace(Math.floor(Math.random()*20)+1); t++;
      if(t>14){clearInterval(iv);const r=Math.floor(Math.random()*20)+1;setFace(r);setResult(r);setRolling(false);setTimeout(()=>onRoll(r),600);}
    },60);
  };
  const total=result?result+check.modifier:null;
  const ok=total>=check.dc;
  return <div style={{background:A.bgDeep,border:`1px solid ${A.borderGold}`,padding:"18px 20px",position:"relative",marginTop:8}}>
    {[[0,0],[0,1],[1,0],[1,1]].map(([r,c],i)=><div key={i} style={{position:"absolute",top:r?"auto":0,bottom:r?0:"auto",left:c?"auto":0,right:c?0:"auto",transform:r&&c?"scale(-1)":r?"scaleY(-1)":c?"scaleX(-1)":"none"}}><CornerRune/></div>)}
    <div style={{textAlign:"center"}}>
      <div style={{fontFamily:"'Cinzel',serif",color:A.gold,fontSize:11,letterSpacing:3,marginBottom:12,textTransform:"uppercase"}}>Skill Check Required</div>
      <div style={{fontFamily:"'Cinzel',serif",color:A.parchment,fontSize:16,marginBottom:4}}>{check.stat}</div>
      <div style={{color:A.parchmentDim,fontSize:12,marginBottom:16}}>DC {check.dc} · Modifier +{check.modifier}</div>
      <div onClick={!rolling&&!result?handleRoll:undefined} style={{width:64,height:64,margin:"0 auto 14px",cursor:result?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",position:"relative"}}>
        <svg width="64" height="64" viewBox="0 0 64 64" fill="none" style={{position:"absolute"}}>
          <polygon points="32,4 60,20 60,44 32,60 4,44 4,20" stroke={result?(ok?A.success:A.danger):A.gold} strokeWidth="1.5" fill={A.bgDeep}/>
          <polygon points="32,10 54,23 54,41 32,54 10,41 10,23" stroke={result?(ok?A.success:A.danger):A.borderGold} strokeWidth="0.5" fill="none"/>
        </svg>
        <span style={{fontFamily:"'Cinzel',serif",fontSize:result?22:18,color:result?(ok?A.success:A.danger):A.gold,position:"relative",zIndex:1}}>{rolling?face:result?face:"d20"}</span>
      </div>
      {result ? <div style={{fontFamily:"'Cinzel',serif",fontSize:13,color:ok?A.success:A.danger,letterSpacing:2}}>{result} + {check.modifier} = {total} · {ok?"SUCCESS":"FAILURE"}</div>
      : <button onClick={handleRoll} disabled={rolling} style={{background:"none",border:`1px solid ${A.gold}`,color:A.gold,fontFamily:"'Cinzel',serif",fontSize:11,letterSpacing:3,padding:"8px 24px",cursor:rolling?"wait":"pointer",textTransform:"uppercase",opacity:rolling?.5:1}}>{rolling?"Rolling...":"Roll the Dice"}</button>}
    </div>
  </div>;
}

function AStatPip({label,val,mod}) {
  return <div style={{textAlign:"center"}}>
    <div style={{width:40,height:46,border:`1px solid ${A.borderGold}`,background:A.bgDeep,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",clipPath:"polygon(0 8px,8px 0,calc(100% - 8px) 0,100% 8px,100% calc(100% - 8px),calc(100% - 8px) 100%,8px 100%,0 calc(100% - 8px))"}}>
      <span style={{fontFamily:"'Cinzel',serif",fontSize:16,color:A.gold}}>{val}</span>
      <span style={{fontFamily:"'Cinzel',serif",fontSize:9,color:A.dimText}}>{mod>=0?`+${mod}`:mod}</span>
    </div>
    <div style={{fontFamily:"'Cinzel',serif",fontSize:8,color:A.dimText,marginTop:4,letterSpacing:1}}>{label}</div>
  </div>;
}

function DirectionA({width,height}) {
  const [turns,setTurns]=useState(TURNS_A_INIT);
  const [input,setInput]=useState("");
  const handleRoll=(roll)=>{
    const total=roll+3,ok=total>=14;
    setTurns(p=>p.map(t=>t.role==="check"?{...t,rolled:roll}:t));
    setTimeout(()=>setTurns(p=>[...p,{role:"dm",text:ok
      ?"Grim meets your eyes for the first time. Something shifts in the hard lines of his face.\n\n\"Alright. There's a merchant. Kael. Came through here three nights past. Owes me thirty gold and a lot more than that in explanations. He headed north — toward the old mill road.\"\n\nHe picks up the tankard again. \"Don't come back without word of him.\""
      :"Grim doesn't even look up. \"I don't talk business with strangers.\" He turns away, and that's the end of it — for now."}]),1000);
  };
  return <div style={{width,height,background:A.bg,display:"flex",overflow:"hidden",position:"relative",fontFamily:"'IM Fell English',serif"}}>
    <ParchmentDust/>
    {/* LEFT */}
    <div style={{width:196,background:A.bgDeep,borderRight:`1px solid ${A.border}`,display:"flex",flexDirection:"column",padding:"18px 13px",flexShrink:0,zIndex:1,overflow:"hidden"}}>
      <div style={{width:"100%",aspectRatio:"1/1",border:`1px solid ${A.borderGold}`,background:A.ink,position:"relative",marginBottom:10,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>
        {[[2,2,"none"],[2,null,2,"scaleX(-1)"],[null,2,2,"scaleY(-1)"],[null,null,null,"scale(-1)"]].map(([t,b,l,tr],i)=><div key={i} style={{position:"absolute",top:t??undefined,bottom:b??undefined,left:l??undefined,right:l===undefined?2:undefined,transform:tr}}><CornerRune size={14}/></div>)}
        <svg width="60" height="80" viewBox="0 0 60 80" fill="none" opacity="0.15">
          <ellipse cx="30" cy="18" rx="13" ry="15" fill={A.parchment}/>
          <path d="M10 80 Q10 45 30 42 Q50 45 50 80 Z" fill={A.parchment}/>
          <rect x="2" y="44" width="14" height="28" rx="4" fill={A.parchment}/>
          <rect x="44" y="44" width="14" height="28" rx="4" fill={A.parchment}/>
        </svg>
        <div style={{position:"absolute",bottom:0,left:0,right:0,background:"rgba(0,0,0,0.6)",padding:"3px 0",textAlign:"center"}}>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:8,color:A.parchmentDim,letterSpacing:1}}>character portrait</span>
        </div>
      </div>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:13,color:A.gold,textAlign:"center",marginBottom:2}}>Ser Aldric</div>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:A.dimText,textAlign:"center",letterSpacing:2,marginBottom:12}}>HUMAN FIGHTER · LVL 3</div>
      <div style={{marginBottom:12}}>
        <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:8,color:A.dimText,letterSpacing:1}}>VITALITY</span>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:8,color:A.ember}}>24 / 32</span>
        </div>
        <div style={{height:4,background:A.border,position:"relative"}}>
          <div style={{position:"absolute",left:0,top:0,height:"100%",width:"75%",background:`linear-gradient(to right,${A.ember},${A.gold})`}}/>
        </div>
      </div>
      <OrnamentDivider/>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:5,marginBottom:12}}>
        {[["STR","16",3],["DEX","12",1],["CON","14",2],["INT","8",-1],["WIS","10",0],["CHA","13",1]].map(([l,v,m])=><AStatPip key={l} label={l} val={v} mod={m}/>)}
      </div>
      <OrnamentDivider/>
      <div style={{marginTop:4,marginBottom:8}}>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:8,color:A.dimText,letterSpacing:2,marginBottom:5}}>LOCATION</div>
        <span style={{fontFamily:"'Cinzel',serif",fontSize:9,color:A.parchmentDim}}>The Grimwood Tavern</span>
        <div style={{fontFamily:"'IM Fell English',serif",fontSize:10,color:A.dimText,marginTop:3,fontStyle:"italic",lineHeight:1.5}}>A crossroads inn at the forest edge.</div>
      </div>
      <div style={{flex:1}}/>
      <div style={{borderTop:`1px solid ${A.border}`,paddingTop:8,marginTop:8}}>
        {["Longsword","Chain Mail","Healer's Kit","30 gp"].map((item,i)=><div key={i} style={{display:"flex",alignItems:"center",gap:6,marginBottom:4}}>
          <div style={{width:3,height:3,background:A.borderGold,transform:"rotate(45deg)",flexShrink:0}}/>
          <span style={{fontFamily:"'IM Fell English',serif",fontSize:10,color:A.dimText}}>{item}</span>
        </div>)}
      </div>
    </div>
    {/* MAIN */}
    <div style={{flex:1,display:"flex",flexDirection:"column",position:"relative",zIndex:1,minWidth:0}}>
      <div style={{borderBottom:`1px solid ${A.border}`,padding:"11px 18px",display:"flex",alignItems:"center",justifyContent:"space-between",background:A.bgDeep,flexShrink:0}}>
        <div style={{display:"flex",alignItems:"center",gap:10}}>
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
            <polygon points="10,1 19,5.5 19,14.5 10,19 1,14.5 1,5.5" stroke={A.gold} strokeWidth="1" fill="none"/>
            <polygon points="10,5 15,7.5 15,12.5 10,15 5,12.5 5,7.5" stroke={A.borderGold} strokeWidth="0.5" fill={A.bgDeep}/>
            <text x="10" y="13" textAnchor="middle" fill={A.gold} fontSize="7" fontFamily="serif">C</text>
          </svg>
          <div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:12,color:A.gold,letterSpacing:1}}>The Tavern at Grimwood Crossing</div>
            <div style={{fontFamily:"'Cinzel',serif",fontSize:8,color:A.dimText,letterSpacing:2}}>SESSION I · TURN 4</div>
          </div>
        </div>
        <div style={{display:"flex",gap:14,alignItems:"center"}}>
          {["Lore","Party","Map"].map(l=><button key={l} style={{background:"none",border:"none",fontFamily:"'Cinzel',serif",fontSize:9,color:A.dimText,letterSpacing:2,cursor:"pointer",textTransform:"uppercase",padding:0}}>{l}</button>)}
          <div style={{width:7,height:7,borderRadius:"50%",background:A.success,boxShadow:`0 0 6px ${A.success}`}}/>
        </div>
      </div>
      <div style={{padding:"14px 22px 10px",borderBottom:`1px solid ${A.border}`,background:`linear-gradient(to bottom,rgba(30,24,18,0.5),transparent)`,flexShrink:0}}>
        <div style={{fontFamily:"'IM Fell English',serif",fontSize:11,color:A.dimText,fontStyle:"italic",letterSpacing:1,marginBottom:3}}>❧ Scene I — The Weary Road</div>
        <div style={{fontFamily:"'Cinzel',serif",fontSize:16,color:A.parchment,letterSpacing:1}}>The Barroom Floor</div>
      </div>
      <div style={{flex:1,overflowY:"auto",padding:"18px 22px",display:"flex",flexDirection:"column",gap:3}}>
        {turns.map((turn,i)=>{
          if(turn.role==="check") return <div key={i} style={{paddingLeft:20}}><ADicePrompt check={turn} onRoll={handleRoll}/></div>;
          const isDM=turn.role==="dm";
          return <div key={i} style={{marginBottom:14}}>
            {isDM?<div style={{display:"flex",alignItems:"center",gap:7,marginBottom:5}}>
              <svg width="13" height="13" viewBox="0 0 13 13" fill="none"><polygon points="6.5,1 12,3.5 12,9.5 6.5,12 1,9.5 1,3.5" fill={A.borderGold} stroke={A.gold} strokeWidth="0.5"/><polygon points="6.5,3.5 10,5.5 10,8 6.5,9.5 3,8 3,5.5" fill={A.goldDim} opacity="0.4"/></svg>
              <span style={{fontFamily:"'Cinzel',serif",fontSize:9,color:A.goldDim,letterSpacing:3,textTransform:"uppercase"}}>Dungeon Master</span>
            </div>:<div style={{textAlign:"right",marginBottom:5}}><span style={{fontFamily:"'Cinzel',serif",fontSize:9,color:A.dimText,letterSpacing:3,textTransform:"uppercase"}}>Ser Aldric · Fighter</span></div>}
            <div style={{background:isDM?A.bgPanel:"transparent",border:isDM?`1px solid ${A.border}`:"none",borderLeft:isDM?`2px solid ${A.borderGold}`:"none",borderRight:!isDM?`2px solid ${A.borderGold}`:"none",padding:isDM?"11px 15px":"0",textAlign:isDM?"left":"right"}}>
              <p style={{fontFamily:"'IM Fell English',serif",fontSize:13,lineHeight:1.8,color:isDM?A.parchment:A.parchmentDim,margin:0,fontStyle:isDM?"normal":"italic",whiteSpace:"pre-wrap"}}>{turn.text}</p>
            </div>
          </div>;
        })}
      </div>
      <div style={{borderTop:`1px solid ${A.border}`,padding:"12px 18px",background:A.bgDeep,flexShrink:0}}>
        <div style={{display:"flex",gap:7,marginBottom:7}}>
          {["Ask about Kael","Buy a drink","Leave quietly"].map(s=><button key={s} onClick={()=>setInput(s)} style={{background:"none",border:`1px solid ${A.border}`,color:A.dimText,fontFamily:"'IM Fell English',serif",fontSize:11,padding:"3px 9px",cursor:"pointer",fontStyle:"italic"}}>{s}</button>)}
        </div>
        <div style={{display:"flex",gap:7,alignItems:"stretch"}}>
          <textarea value={input} onChange={e=>setInput(e.target.value)} placeholder="Describe your action..." style={{flex:1,background:A.ink,border:`1px solid ${A.borderGold}`,color:A.parchment,fontFamily:"'IM Fell English',serif",fontSize:13,padding:"9px 12px",resize:"none",height:52,outline:"none",fontStyle:"italic",lineHeight:1.6}}/>
          <button style={{background:A.bgDeep,border:`1px solid ${A.gold}`,color:A.gold,fontFamily:"'Cinzel',serif",fontSize:10,letterSpacing:2,padding:"0 16px",cursor:"pointer",textTransform:"uppercase"}}>Act</button>
        </div>
      </div>
    </div>
    {/* RIGHT */}
    <div style={{width:172,background:A.bgDeep,borderLeft:`1px solid ${A.border}`,padding:"18px 13px",display:"flex",flexDirection:"column",flexShrink:0,zIndex:1,overflow:"hidden"}}>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:A.dimText,letterSpacing:3,marginBottom:11,textTransform:"uppercase"}}>Known Lore</div>
      {[{type:"NPC",name:"Old Grim",note:"Retired soldier. Gruff."},{type:"NPC",name:"The Stranger",note:"Hooded figure. Watching."},{type:"PLACE",name:"Mill Road North",note:"Kael was seen heading this way."},{type:"QUEST",name:"Find Kael",note:"Missing merchant. Owes Grim 30gp."}].map((e,i)=><div key={i} style={{marginBottom:11}}>
        <div style={{display:"flex",gap:5,alignItems:"center",marginBottom:2}}>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:7,color:A.ember,letterSpacing:1,border:`1px solid ${A.ember}`,padding:"1px 3px",opacity:.7}}>{e.type}</span>
          <span style={{fontFamily:"'Cinzel',serif",fontSize:10,color:A.parchmentDim}}>{e.name}</span>
        </div>
        <div style={{fontFamily:"'IM Fell English',serif",fontSize:10,color:A.dimText,fontStyle:"italic",lineHeight:1.5,paddingLeft:7,borderLeft:`1px solid ${A.border}`}}>{e.note}</div>
      </div>)}
      <OrnamentDivider/>
      <div style={{fontFamily:"'Cinzel',serif",fontSize:9,color:A.dimText,letterSpacing:3,margin:"7px 0 9px",textTransform:"uppercase"}}>NPC Status</div>
      {[{name:"Old Grim",mood:"Neutral",color:A.dimText},{name:"The Stranger",mood:"Watching",color:A.ember},{name:"Town Guard",mood:"Suspicious",color:"#8a6a30"}].map((n,i)=><div key={i} style={{display:"flex",justifyContent:"space-between",marginBottom:6}}>
        <span style={{fontFamily:"'IM Fell English',serif",fontSize:11,color:A.parchmentDim}}>{n.name}</span>
        <span style={{fontFamily:"'Cinzel',serif",fontSize:8,color:n.color,letterSpacing:1}}>{n.mood}</span>
      </div>)}
    </div>
  </div>;
}

// ═══════════════════════════════════════════════════════════
// DIRECTION B — ARCANE TERMINAL
// Void navy + cyan + cold white · monospace · scanlines
// ═══════════════════════════════════════════════════════════
const B = {
  bg:"#050b14", bgPanel:"#080f1c", bgCard:"#0b1424",
  border:"#0e2040", borderCyan:"#0d4060",
  cyan:"#2ee8c8", cyanDim:"#0d8a70",
  blue:"#1a6eb5", white:"#d4eef8",
  dimText:"#2a5070", midText:"#4a7a9a",
  danger:"#e05050", warn:"#e0a030", success:"#2ee890",
  grid:"rgba(14,32,64,0.6)",
};

function GridBg() {
  return <div style={{position:"absolute",inset:0,pointerEvents:"none",zIndex:0,backgroundImage:`linear-gradient(${B.grid} 1px,transparent 1px),linear-gradient(90deg,${B.grid} 1px,transparent 1px)`,backgroundSize:"40px 40px"}}/>;
}
function ScanlinesBg() {
  return <div style={{position:"absolute",inset:0,pointerEvents:"none",zIndex:0,backgroundImage:`repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(14,32,64,0.3) 3px,rgba(14,32,64,0.3) 4px)`,opacity:.5}}/>;
}

function RuneField() {
  const ref = useRef(null);
  useEffect(() => {
    const c=ref.current; if(!c) return;
    const ctx=c.getContext("2d");
    c.width=c.offsetWidth; c.height=c.offsetHeight;
    const G="ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟ⌬⌘⎔⏣◈◇⬡⬢";
    const cols=Math.floor(c.width/28), rows=Math.floor(c.height/28);
    const cells=Array.from({length:cols*rows},()=>({glyph:G[Math.floor(Math.random()*G.length)],op:Math.random()*.04,tick:Math.random()*200,speed:Math.random()*.3+.05}));
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      ctx.font="14px monospace";
      cells.forEach((cell,i)=>{
        const col=i%cols, row=Math.floor(i/cols);
        cell.tick+=cell.speed;
        const pulse=Math.sin(cell.tick*.05)*.5+.5;
        ctx.fillStyle=`rgba(46,232,200,${cell.op*pulse})`;
        ctx.fillText(cell.glyph,col*28+8,row*28+20);
        if(Math.random()<.0002)cell.glyph=G[Math.floor(Math.random()*G.length)];
      });
      raf=requestAnimationFrame(draw);
    };
    draw(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}/>;
}

function InkWash() {
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current; if(!c) return;
    const ctx=c.getContext("2d");
    c.width=c.offsetWidth; c.height=c.offsetHeight;
    let t=0, raf;
    const draw=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      for(let i=0;i<4;i++){
        const x=(c.width*.2*i+Math.sin(t*.0003+i*1.3)*c.width*.08)%c.width;
        const y=c.height*.5+Math.cos(t*.0002+i*.9)*c.height*.25;
        const r=c.width*.28;
        const g=ctx.createRadialGradient(x,y,0,x,y,r);
        g.addColorStop(0,"rgba(196,82,42,0.025)"); g.addColorStop(1,"transparent");
        ctx.fillStyle=g; ctx.fillRect(0,0,c.width,c.height);
      }
      t++; raf=requestAnimationFrame(draw);
    };
    draw(); return ()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none"}}/>;
}

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "showNotes": true
}/*EDITMODE-END*/;

function useTweaksLocal(defaults) {
  const [tweaks, setTweaksState] = useState(defaults);
  const setTweak = useCallback((key, val) => {
    setTweaksState(prev => {
      const next = typeof key === "object" ? {...prev,...key} : {...prev,[key]:val};
      window.parent.postMessage({type:"__edit_mode_set_keys", edits: next},"*");
      return next;
    });
  }, []);
  return [tweaks, setTweak];
}

function FocusOverlay({dir, onClose}) {
  const vw=window.innerWidth, vh=window.innerHeight;
  const W=1100, H=680;
  const scale=Math.min((vw*.9)/W,(vh*.9)/H);
  const Comp=dir.id==="A"?DirectionA:dir.id==="B"?DirectionB:DirectionC;
  useEffect(()=>{const h=e=>{if(e.key==="Escape")onClose();};window.addEventListener("keydown",h);return()=>window.removeEventListener("keydown",h);},[onClose]);
  return <div onClick={onClose} style={{position:"fixed",inset:0,zIndex:1000,background:"rgba(0,0,0,0.88)",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(6px)"}}>
    <div onClick={e=>e.stopPropagation()} style={{position:"relative"}}>
      <button onClick={onClose} style={{position:"absolute",top:-32,right:0,background:"none",border:"none",fontFamily:"'DM Sans',sans-serif",fontSize:11,color:"rgba(255,255,255,0.4)",cursor:"pointer",letterSpacing:2}}>ESC — close</button>
      <div style={{transform:`scale(${scale})`,transformOrigin:"top left",width:W,height:H}}>
        <Comp width={W} height={H}/>
      </div>
      <div style={{position:"absolute",bottom:-28,left:0,fontFamily:"'DM Sans',sans-serif",fontSize:10,color:dir.accent,letterSpacing:2,textTransform:"uppercase"}}>Direction {dir.id} · {dir.label} · {dir.sub}</div>
    </div>
  </div>;
}

            <span style={{fontSize:11,color:"rgba(255,255,255,0.75)",fontWeight:500}}>{dir.label}</span>
          </div>
          <div style={{fontSize:8,color:"rgba(255,255,255,0.28)",letterSpacing:2,textTransform:"uppercase",marginBottom:7}}>{dir.sub}</div>
          <div style={{display:"flex",gap:3,marginBottom:7}}>{dir.palette.map((c,i)=><div key={i} style={{width:13,height:13,background:c,border:"1px solid rgba(255,255,255,0.08)"}}/>)}</div>
          <div style={{fontSize:9,color:"rgba(255,255,255,0.32)",lineHeight:1.65}}>{dir.desc}</div>
          <div style={{marginTop:7,fontSize:9,color:"rgba(255,255,255,0.22)"}}>{dir.typeA} + {dir.typeB}</div>
        </div>)}

        {tweaks.showNotes&&<div style={{background:"rgba(255,255,255,0.015)",border:"1px solid rgba(255,255,255,0.05)",padding:"13px",marginTop:8}}>
          <div style={{fontSize:8,color:"rgba(255,255,255,0.25)",letterSpacing:3,textTransform:"uppercase",marginBottom:12}}>Design System Notes</div>
          {SYSTEM_NOTES.map((n,i)=><div key={i} style={{marginBottom:12}}>
            <div style={{fontSize:10,color:"rgba(255,255,255,0.55)",marginBottom:3,fontWeight:500}}>{n.h}</div>
            <div style={{fontSize:9,color:"rgba(255,255,255,0.28)",lineHeight:1.7,whiteSpace:"pre-wrap"}}>{n.b}</div>
          </div>)}
        </div>}
      </div>
    </div>

    {/* CANVAS */}
    <div style={{flex:1,overflowX:"auto",overflowY:"auto",padding:"28px 28px 44px",display:"flex",flexDirection:"column",gap:36,alignItems:"flex-start"}}>
      {/* Canvas header */}
      <div style={{width:"100%",display:"flex",justifyContent:"space-between",alignItems:"flex-start",flexShrink:0}}>
        <div>
          <div style={{fontSize:20,color:"rgba(255,255,255,0.78)",fontWeight:500,marginBottom:3}}>Active Session View</div>
          <div style={{fontSize:11,color:"rgba(255,255,255,0.28)",lineHeight:1.7,maxWidth:500}}>Three distinct directions for Cairn's main game UI. Each is fully interactive — click the die to roll, type in the inputs. Click ⊞ or Focus to zoom fullscreen.</div>
        </div>
        <div style={{display:"flex",gap:7,alignItems:"center",flexShrink:0}}>
          <button onClick={()=>setTweak("showNotes",!tweaks.showNotes)} style={{background:"none",border:"1px solid rgba(255,255,255,0.1)",color:"rgba(255,255,255,0.35)",fontFamily:"'DM Sans',sans-serif",fontSize:9,letterSpacing:2,padding:"5px 11px",cursor:"pointer",textTransform:"uppercase"}}>{tweaks.showNotes?"Hide":"Show"} Notes</button>
          {visible.map(dir=><button key={dir.id} onClick={()=>setFocused(dir.id)} style={{background:"none",border:`1px solid ${dir.accent}44`,color:dir.accent,fontFamily:"'DM Sans',sans-serif",fontSize:9,letterSpacing:2,padding:"5px 11px",cursor:"pointer",textTransform:"uppercase"}}>Focus {dir.id}</button>)}
        </div>
      </div>

      {/* Artboards */}
      <div style={{display:"flex",flexDirection:activeDir==="all"?"column":"row",gap:36,alignItems:"flex-start",flexShrink:0}}>
        {visible.map(dir=>{
          const DirComp=Comp(dir.id);
          return <div key={dir.id} style={{flexShrink:0}}>
            <div style={{display:"flex",alignItems:"center",gap:9,marginBottom:10}}>
              <div style={{width:3,height:14,background:dir.accent}}/>
              <span style={{fontSize:12,color:"rgba(255,255,255,0.65)",fontWeight:500}}>Direction {dir.id} — {dir.label}</span>
              <span style={{fontSize:11,color:"rgba(255,255,255,0.22)",marginLeft:6}}>{dir.sub}</span>
              <span style={{fontSize:10,color:"rgba(255,255,255,0.2)",marginLeft:4}}>{dir.typeA} + {dir.typeB}</span>
            </div>
            <div style={{width:W,height:H,position:"relative",overflow:"hidden",border:"1px solid rgba(255,255,255,0.06)"}}>
              <div style={{position:"absolute",top:10,right:10,zIndex:100,background:"rgba(0,0,0,0.72)",border:`1px solid ${dir.accent}`,padding:"2px 9px",pointerEvents:"none"}}>
                <span style={{fontFamily:"'DM Sans',sans-serif",fontSize:8,color:dir.accent,letterSpacing:2,textTransform:"uppercase"}}>Dir {dir.id} · {dir.label}</span>
              </div>
              <DirComp width={W} height={H}/>
            </div>
          </div>;
        })}
      </div>
    </div>

    {focused&&<FocusOverlay dir={DIRS.find(d=>d.id===focused)} onClose={()=>setFocused(null)}/>}
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
