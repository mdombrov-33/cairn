<link rel="preconnect" href="https://fonts.googleapis.com"/>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body,#root{width:100%;height:100%;overflow:hidden;background:#0a0809;}
::-webkit-scrollbar{width:4px;height:4px;}
::-webkit-scrollbar-track{background:transparent;}
::-webkit-scrollbar-thumb{background:#2e2318;border-radius:2px;}

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback, useMemo } = React;

// ─── DESIGN TOKENS ────────────────────────────────────────
const T = {
  bg:       "#0a0809",
  bgDeep:   "#070607",
  bgPanel:  "#100d0c",
  bgCard:   "#14110f",
  bgHover:  "#1a1612",
  border:   "#2a1f17",
  borderGold:"#4a3820",
  gold:     "#c9a84c",
  goldDim:  "#7a6030",
  goldFaint:"#3a2c18",
  ember:    "#b54a1e",
  emberDim: "#6a2a10",
  parchment:"#e8d9b8",
  parchDim: "#9a8f78",
  parchFaint:"#5a5040",
  ink:      "#1a1410",
  dimText:  "#6a6050",
  midText:  "#9a8f78",
  success:  "#5a9e5a",
  danger:   "#c04030",
  warn:     "#c08030",
  purple:   "#8060c0",
  blue:     "#4070c0",
};

// ─── SHARED PRIMITIVES ────────────────────────────────────
const F = {
  cinzel: "'Cinzel', serif",
  fell:   "'IM Fell English', serif",
  sans:   "'DM Sans', sans-serif",
};

function CornerRune({size=16,color=T.goldDim}) {
  return <svg width={size} height={size} viewBox="0 0 16 16" fill="none">
    <path d="M0 0 L6 0 L6 1.5 L1.5 1.5 L1.5 6 L0 6 Z" fill={color}/>
    <path d="M3 3 L4.5 3 L4.5 4.5 L3 4.5 Z" fill={color} opacity="0.5"/>
  </svg>;
}

function GoldDivider({label, style:s={}}) {
  return <div style={{display:"flex",alignItems:"center",gap:8,...s}}>
    <div style={{flex:1,height:1,background:`linear-gradient(to right,transparent,${T.borderGold})`}}/>
    {label
      ? <span style={{fontFamily:F.cinzel,fontSize:8,color:T.goldDim,letterSpacing:3,textTransform:"uppercase",flexShrink:0}}>{label}</span>
      : <svg width="10" height="10" viewBox="0 0 10 10" fill="none">
          <rect x="3" y="0" width="4" height="4" transform="rotate(45 5 2)" fill={T.goldDim}/>
        </svg>
    }
    <div style={{flex:1,height:1,background:`linear-gradient(to left,transparent,${T.borderGold})`}}/>
  </div>;
}

function OrnamentBox({children, style:s={}, glow=false}) {
  return <div style={{position:"relative",border:`1px solid ${T.borderGold}`,background:T.bgCard,...s,
    boxShadow:glow?`0 0 24px rgba(201,168,76,0.08) inset`:"none"}}>
    <div style={{position:"absolute",top:0,left:0}}><CornerRune/></div>
    <div style={{position:"absolute",top:0,right:0,transform:"scaleX(-1)"}}><CornerRune/></div>
    <div style={{position:"absolute",bottom:0,left:0,transform:"scaleY(-1)"}}><CornerRune/></div>
    <div style={{position:"absolute",bottom:0,right:0,transform:"scale(-1)"}}><CornerRune/></div>
    {children}
  </div>;
}

function GoldBtn({children,onClick,variant="outline",style:s={},disabled=false}) {
  const base = {fontFamily:F.cinzel,fontSize:10,letterSpacing:2,textTransform:"uppercase",padding:"9px 20px",border:"none",cursor:disabled?"not-allowed":"pointer",transition:"all 0.15s",opacity:disabled?0.5:1,...s};
  if(variant==="solid") return <button onClick={onClick} disabled={disabled} style={{...base,background:T.gold,color:T.bgDeep,fontWeight:"600"}}>{children}</button>;
  if(variant==="ember") return <button onClick={onClick} disabled={disabled} style={{...base,background:T.ember,color:T.parchment,border:`1px solid ${T.emberDim}`}}>{children}</button>;
  return <button onClick={onClick} disabled={disabled} style={{...base,background:"none",border:`1px solid ${T.gold}`,color:T.gold}}>{children}</button>;
}

function ImagePlaceholder({label,width="100%",height=120,style:s={}}) {
  return <div style={{width,height,background:T.bgDeep,border:`1px solid ${T.border}`,display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden",...s}}>
    <svg style={{position:"absolute",inset:0,width:"100%",height:"100%",opacity:0.06}}>
      <defs><pattern id={`h${label}`} width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="10" stroke={T.parchDim} strokeWidth="0.8"/>
      </pattern></defs>
      <rect width="100%" height="100%" fill={`url(#h${label})`}/>
    </svg>
    <svg width="28" height="28" viewBox="0 0 28 28" fill="none" style={{opacity:0.2,marginBottom:6}}>
      <rect x="1" y="1" width="26" height="26" stroke={T.parchDim} strokeWidth="0.5"/>
      <line x1="1" y1="1" x2="27" y2="27" stroke={T.parchDim} strokeWidth="0.5"/>
      <line x1="27" y1="1" x2="1" y2="27" stroke={T.parchDim} strokeWidth="0.5"/>
    </svg>
    <span style={{fontFamily:F.sans,fontSize:9,color:T.dimText,letterSpacing:1,textTransform:"uppercase",textAlign:"center",padding:"0 8px"}}>{label}</span>
  </div>;
}

// Floating dust particles
function DustCanvas({opacity=1}) {
  const ref=useRef(null);
  useEffect(()=>{
    const c=ref.current; if(!c)return;
    const ctx=c.getContext("2d");
    c.width=c.offsetWidth; c.height=c.offsetHeight;
    const pts=Array.from({length:50},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.2+0.2,dx:(Math.random()-.5)*.1,dy:-Math.random()*.15-.03,op:Math.random()*.18+.04}));
    let raf;
    const draw=()=>{
      ctx.clearRect(0,0,c.width,c.height);
      pts.forEach(p=>{
        ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
        ctx.fillStyle=`rgba(201,168,76,${p.op})`;ctx.fill();
        p.x+=p.dx;p.y+=p.dy;
        if(p.y<-2){p.y=c.height+2;p.x=Math.random()*c.width;}
        if(p.x<-2)p.x=c.width+2;if(p.x>c.width+2)p.x=-2;
      });
      raf=requestAnimationFrame(draw);
    };
    draw();return()=>cancelAnimationFrame(raf);
  },[]);
  return <canvas ref={ref} style={{position:"absolute",inset:0,width:"100%",height:"100%",pointerEvents:"none",opacity}}/>;
}

// ─── SIDEBAR NAV ──────────────────────────────────────────
const NAV_ITEMS = [
  {id:"campaigns", icon:"⬡", label:"Campaigns"},
  {id:"session",   icon:"◈", label:"Play"},
  {id:"sheet",     icon:"◇", label:"Character"},
  {id:"spells",    icon:"✦", label:"Spells"},
  {id:"lore",      icon:"⌬", label:"Lore"},
  {id:"summary",   icon:"⏣", label:"Summary"},
];

function Sidebar({screen, onNav, collapsed, onToggle}) {
  return <div style={{width:collapsed?52:190,background:T.bgDeep,borderRight:`1px solid ${T.border}`,display:"flex",flexDirection:"column",flexShrink:0,transition:"width 0.2s",overflow:"hidden"}}>
    {/* Logo */}
    <div style={{padding:collapsed?"14px 0":"16px 14px",borderBottom:`1px solid ${T.border}`,display:"flex",alignItems:"center",gap:10,justifyContent:collapsed?"center":"flex-start",flexShrink:0}}>
      <svg width="22" height="28" viewBox="0 0 22 28" fill="none" style={{flexShrink:0}}>
        <rect x="7" y="0" width="8" height="5" rx="0.5" fill={T.gold} opacity="0.9"/>
        <rect x="4" y="6.5" width="14" height="5" rx="0.5" fill={T.gold} opacity="0.65"/>
        <rect x="1" y="13" width="20" height="5" rx="0.5" fill={T.gold} opacity="0.4"/>
        <rect x="4" y="19.5" width="14" height="5" rx="0.5" fill={T.gold} opacity="0.22"/>
      </svg>
      {!collapsed&&<div>
        <div style={{fontFamily:F.cinzel,fontSize:14,color:T.gold,letterSpacing:3}}>CAIRN</div>
        <div style={{fontFamily:F.sans,fontSize:8,color:T.dimText,letterSpacing:2,textTransform:"uppercase"}}>AI Dungeon Master</div>
      </div>}
    </div>
    {/* Nav items */}
    <div style={{flex:1,paddingTop:8,overflowY:"auto"}}>
      {NAV_ITEMS.map(item=>{
        const active=screen===item.id;
        return <div key={item.id} onClick={()=>onNav(item.id)} style={{
          display:"flex",alignItems:"center",gap:10,
          padding:collapsed?"12px 0":"10px 14px",
          justifyContent:collapsed?"center":"flex-start",
          cursor:"pointer",
          background:active?T.bgHover:"none",
          borderLeft:active?`2px solid ${T.gold}`:"2px solid transparent",
          transition:"all 0.12s",
          marginBottom:2,
        }}>
          <span style={{fontSize:14,color:active?T.gold:T.dimText,flexShrink:0,lineHeight:1}}>{item.icon}</span>
          {!collapsed&&<span style={{fontFamily:F.cinzel,fontSize:10,color:active?T.gold:T.dimText,letterSpacing:2,textTransform:"uppercase"}}>{item.label}</span>}
        </div>;
      })}
    </div>
    {/* Collapse toggle */}
    <div style={{borderTop:`1px solid ${T.border}`,padding:"10px 0",display:"flex",justifyContent:"center"}}>
      <button onClick={onToggle} style={{background:"none",border:"none",color:T.dimText,fontSize:12,padding:"4px 8px"}}>
        {collapsed?"▶":"◀"}
      </button>
    </div>
    {/* User */}
    {!collapsed&&<div style={{borderTop:`1px solid ${T.border}`,padding:"12px 14px",display:"flex",alignItems:"center",gap:8,flexShrink:0}}>
      <div style={{width:26,height:26,border:`1px solid ${T.borderGold}`,background:T.ink,display:"flex",alignItems:"center",justifyContent:"center"}}>
        <span style={{fontFamily:F.cinzel,fontSize:10,color:T.goldDim}}>A</span>
      </div>
      <div>
        <div style={{fontFamily:F.cinzel,fontSize:9,color:T.parchDim,letterSpacing:1}}>Ser Aldric</div>
        <div style={{fontFamily:F.sans,fontSize:8,color:T.dimText}}>Free Tier</div>
      </div>
    </div>}
  </div>;
}

// ─── SCREEN: LOGIN ────────────────────────────────────────
function LoginScreen({onEnter}) {
  const [email,setEmail]=useState("");
  const [pass,setPass]=useState("");
  const [mode,setMode]=useState("login");
  return <div style={{width:"100%",height:"100%",background:T.bg,display:"flex",alignItems:"center",justifyContent:"center",position:"relative",overflow:"hidden"}}>
    <DustCanvas opacity={0.7}/>
    {/* Vignette */}
    <div style={{position:"absolute",inset:0,background:`radial-gradient(ellipse at center, transparent 30%, rgba(7,6,7,0.85) 100%)`,pointerEvents:"none"}}/>
    {/* Background art placeholder */}
    <div style={{position:"absolute",inset:0,zIndex:0}}>
      <ImagePlaceholder label="Scene art — tavern at night, torchlight, fog" width="100%" height="100%" style={{border:"none"}}/>
    </div>
    {/* Panel */}
    <div style={{position:"relative",zIndex:2,width:380}}>
      <OrnamentBox style={{padding:"36px 32px"}} glow>
        {/* Logo */}
        <div style={{textAlign:"center",marginBottom:28}}>
          <svg width="36" height="46" viewBox="0 0 36 46" fill="none" style={{margin:"0 auto 10px",display:"block"}}>
            <rect x="11" y="0" width="14" height="8" rx="1" fill={T.gold} opacity="0.95"/>
            <rect x="6" y="10" width="24" height="8" rx="1" fill={T.gold} opacity="0.7"/>
            <rect x="1" y="20" width="34" height="8" rx="1" fill={T.gold} opacity="0.45"/>
            <rect x="6" y="30" width="24" height="8" rx="1" fill={T.gold} opacity="0.25"/>
            <rect x="11" y="40" width="14" height="6" rx="1" fill={T.gold} opacity="0.12"/>
          </svg>
          <div style={{fontFamily:F.cinzel,fontSize:28,color:T.gold,letterSpacing:6,marginBottom:4}}>CAIRN</div>
          <div style={{fontFamily:F.fell,fontSize:13,color:T.parchDim,fontStyle:"italic"}}>The world remembers. The trail extends.</div>
        </div>
        <GoldDivider style={{marginBottom:24}}/>
        {/* Mode tabs */}
        <div style={{display:"flex",gap:0,marginBottom:20,border:`1px solid ${T.border}`}}>
          {["login","register"].map(m=><button key={m} onClick={()=>setMode(m)} style={{flex:1,padding:"8px",background:mode===m?T.goldFaint:"none",border:"none",fontFamily:F.cinzel,fontSize:9,color:mode===m?T.gold:T.dimText,letterSpacing:2,textTransform:"uppercase"}}>
            {m==="login"?"Sign In":"Create Account"}
          </button>)}
        </div>
        {/* Form */}
        <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:20}}>
          <div>
            <div style={{fontFamily:F.cinzel,fontSize:8,color:T.goldDim,letterSpacing:2,marginBottom:5,textTransform:"uppercase"}}>Email</div>
            <input value={email} onChange={e=>setEmail(e.target.value)} placeholder="your@email.com" style={{width:"100%",background:T.ink,border:`1px solid ${T.borderGold}`,color:T.parchment,fontFamily:F.fell,fontSize:13,padding:"9px 12px",outline:"none"}}/>
          </div>
          <div>
            <div style={{fontFamily:F.cinzel,fontSize:8,color:T.goldDim,letterSpacing:2,marginBottom:5,textTransform:"uppercase"}}>Password</div>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" style={{width:"100%",background:T.ink,border:`1px solid ${T.borderGold}`,color:T.parchment,fontFamily:F.fell,fontSize:13,padding:"9px 12px",outline:"none"}}/>
          </div>
          {mode==="register"&&<div>
            <div style={{fontFamily:F.cinzel,fontSize:8,color:T.goldDim,letterSpacing:2,marginBottom:5,textTransform:"uppercase"}}>Confirm Password</div>
            <input type="password" placeholder="••••••••" style={{width:"100%",background:T.ink,border:`1px solid ${T.borderGold}`,color:T.parchment,fontFamily:F.fell,fontSize:13,padding:"9px 12px",outline:"none"}}/>
          </div>}
        </div>
        <GoldBtn variant="solid" onClick={onEnter} style={{width:"100%",padding:"12px"}}>
          {mode==="login"?"Enter the World":"Begin Your Journey"}
        </GoldBtn>
        {mode==="login"&&<div style={{textAlign:"center",marginTop:12}}>
          <span style={{fontFamily:F.fell,fontSize:11,color:T.dimText,fontStyle:"italic",cursor:"pointer"}} onClick={()=>setMode("register")}>No account yet? Create one →</span>
        </div>}
      </OrnamentBox>
      <div style={{textAlign:"center",marginTop:14}}>
        <span style={{fontFamily:F.sans,fontSize:9,color:T.dimText,letterSpacing:1}}>Secured by Clerk · Free tier available</span>
      </div>
    </div>
  </div>;
}

// ─── SCREEN: CAMPAIGN BROWSER ─────────────────────────────
const CAMPAIGNS = [
  {id:1,name:"The Tavern at Grimwood Crossing",template:"The Grimwood Chronicles",author:"Cairn Official",sessions:1,turns:14,lastPlayed:"Today",status:"active",character:"Ser Aldric",class:"Fighter",level:3,desc:"A crossroads inn on the edge of a haunted forest. A missing merchant, a mysterious stranger, and a bartender with secrets.",tags:["Intrigue","Forest","Low Combat"]},
  {id:2,name:"Descent into the Salt Mines",template:"Underdark Delve",author:"Cairn Official",sessions:0,turns:0,lastPlayed:"Never",status:"new",character:null,class:null,level:null,desc:"Ancient mines beneath the city have awakened. The miners sent to investigate have not returned.",tags:["Dungeon","Horror","Combat"]},
  {id:3,name:"The Court of Embers",template:"Political Intrigue",author:"Cairn Official",sessions:0,turns:0,lastPlayed:"Never",status:"new",character:null,class:null,level:null,desc:"A noble house on the verge of collapse. Every ally is a suspect. Every suspect is a potential ally.",tags:["Intrigue","Urban","Roleplay-Heavy"]},
];

function CampaignCard({camp, onPlay, onNew}) {
  const [hovered,setHovered]=useState(false);
  const isActive=camp.status==="active";
  return <div onMouseEnter={()=>setHovered(true)} onMouseLeave={()=>setHovered(false)}
    style={{background:hovered?T.bgHover:T.bgCard,border:`1px solid ${hovered?T.borderGold:T.border}`,transition:"all 0.15s",position:"relative",overflow:"hidden"}}>
    {isActive&&<div style={{position:"absolute",top:0,left:0,right:0,height:2,background:`linear-gradient(to right,${T.ember},${T.gold})`}}/>}
    {/* Art placeholder */}
    <ImagePlaceholder label={`Campaign art — ${camp.name}`} height={100} style={{borderBottom:`1px solid ${T.border}`,border:"none",borderBottom:`1px solid ${T.border}`}}/>
    <div style={{padding:"14px 16px"}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:6}}>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontFamily:F.cinzel,fontSize:13,color:T.gold,marginBottom:2,letterSpacing:0.5}}>{camp.name}</div>
          <div style={{fontFamily:F.sans,fontSize:9,color:T.dimText,letterSpacing:1,textTransform:"uppercase"}}>{camp.template} · by {camp.author}</div>
        </div>
        {isActive&&<div style={{fontFamily:F.cinzel,fontSize:7,color:T.ember,border:`1px solid ${T.ember}`,padding:"2px 6px",letterSpacing:1,flexShrink:0,marginLeft:8}}>ACTIVE</div>}
      </div>
      <p style={{fontFamily:F.fell,fontSize:12,color:T.parchDim,lineHeight:1.65,marginBottom:10,fontStyle:"italic"}}>{camp.desc}</p>
      {/* Tags */}
      <div style={{display:"flex",gap:5,flexWrap:"wrap",marginBottom:12}}>
        {camp.tags.map(t=><span key={t} style={{fontFamily:F.sans,fontSize:8,color:T.dimText,border:`1px solid ${T.border}`,padding:"2px 7px"}}>{t}</span>)}
      </div>
      {/* Character / stats */}
      {isActive
        ? <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:`1px solid ${T.border}`,paddingTop:10}}>
            <div style={{display:"flex",gap:14}}>
              <div><div style={{fontFamily:F.cinzel,fontSize:7,color:T.goldDim,letterSpacing:1,marginBottom:2}}>CHARACTER</div><div style={{fontFamily:F.cinzel,fontSize:10,color:T.parchDim}}>{camp.character} · {camp.class} {camp.level}</div></div>
              <div><div style={{fontFamily:F.cinzel,fontSize:7,color:T.goldDim,letterSpacing:1,marginBottom:2}}>SESSIONS</div><div style={{fontFamily:F.cinzel,fontSize:10,color:T.parchDim}}>{camp.sessions}</div></div>
              <div><div style={{fontFamily:F.cinzel,fontSize:7,color:T.goldDim,letterSpacing:1,marginBottom:2}}>LAST PLAYED</div><div style={{fontFamily:F.cinzel,fontSize:10,color:T.parchDim}}>{camp.lastPlayed}</div></div>
            </div>
            <GoldBtn variant="ember" onClick={onPlay} style={{padding:"7px 16px",fontSize:9}}>Continue →</GoldBtn>
          </div>
        : <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",borderTop:`1px solid ${T.border}`,paddingTop:10}}>
            <div style={{fontFamily:F.fell,fontSize:11,color:T.dimText,fontStyle:"italic"}}>No character yet · Session 0</div>
            <GoldBtn onClick={onNew} style={{padding:"7px 16px",fontSize:9}}>Begin →</GoldBtn>
          </div>
      }
    </div>
  </div>;
}

function CampaignScreen({onPlay, onNew}) {
  return <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
    {/* Header */}
    <div style={{padding:"20px 28px 16px",borderBottom:`1px solid ${T.border}`,flexShrink:0,display:"flex",justifyContent:"space-between",alignItems:"flex-end"}}>
      <div>
        <div style={{fontFamily:F.fell,fontSize:11,color:T.dimText,fontStyle:"italic",marginBottom:4}}>Good evening, Ser Aldric</div>
        <div style={{fontFamily:F.cinzel,fontSize:20,color:T.gold,letterSpacing:1}}>Your Campaigns</div>
      </div>
      <GoldBtn style={{fontSize:9,padding:"8px 16px"}}>+ New Campaign</GoldBtn>
    </div>
    {/* Grid */}
    <div style={{flex:1,overflowY:"auto",padding:"24px 28px"}}>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(340px,1fr))",gap:20}}>
        {CAMPAIGNS.map(c=><CampaignCard key={c.id} camp={c} onPlay={onPlay} onNew={onNew}/>)}
      </div>
      <GoldDivider label="Campaign Templates" style={{margin:"28px 0 20px"}}/>
      <div style={{fontFamily:F.fell,fontSize:12,color:T.dimText,fontStyle:"italic",marginBottom:16}}>Start a new campaign from a curated template. The DM will generate the world; you bring the character.</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(200px,1fr))",gap:14}}>
        {["The Sunken City","Plague of Ravens","The Last Kingdom","Crown of Thorns"].map(t=><div key={t} style={{background:T.bgCard,border:`1px solid ${T.border}`,padding:"14px 14px",cursor:"pointer"}}>
          <ImagePlaceholder label={t} height={70} style={{marginBottom:10}}/>
          <div style={{fontFamily:F.cinzel,fontSize:11,color:T.parchDim,letterSpacing:0.5}}>{t}</div>
          <div style={{fontFamily:F.sans,fontSize:9,color:T.dimText,marginTop:3}}>Official Template</div>
        </div>)}
      </div>
    </div>
  </div>;
}

// ─── SCREEN: CHARACTER SHEET ──────────────────────────────
const CHAR = {

function StatBox({label,val,mod}) {
  return <div style={{textAlign:"center",background:T.bgDeep,border:`1px solid ${T.borderGold}`,padding:"8px 4px 6px",
    clipPath:"polygon(0 6px,6px 0,calc(100%-6px) 0,100% 6px,100% calc(100%-6px),calc(100%-6px) 100%,6px 100%,0 calc(100%-6px))"}}>
    <div style={{fontFamily:F.cinzel,fontSize:7,color:T.goldDim,letterSpacing:2,textTransform:"uppercase",marginBottom:4}}>{label}</div>
    <div style={{fontFamily:F.cinzel,fontSize:22,color:T.gold,lineHeight:1}}>{val}</div>
    <div style={{fontFamily:F.cinzel,fontSize:11,color:T.parchDim,marginTop:2}}>{mod>=0?`+${mod}`:mod}</div>
  </div>;
}

function ResourcePip({filled}) {
  return <div style={{width:14,height:14,background:filled?T.gold:T.bgDeep,border:`1px solid ${filled?T.gold:T.borderGold}`,transform:"rotate(45deg)"}}/>;
}

function SheetScreen({char=CHAR}) {

  return <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>

    <div style={{background:T.bgDeep,borderBottom:`1px solid ${T.border}`,padding:"16px 24px",flexShrink:0}}>

              <td style={{fontFamily:F.sans,fontSize:10,color:T.dimText,padding:"10px 12px"}}>{w.dmgType}</td>

          </tbody>

        </div>
      </div>}

      {tab==="inventory"&&<div style={{padding:"20px 24px"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <div style={{fontFamily:F.fell,fontSize:12,color:T.dimText,fontStyle:"italic"}}>Carrying capacity: {char.stats.STR.val*15} lbs</div>

        </div>
        <table style={{width:"100%",borderCollapse:"collapse"}}>
          <thead><tr style={{borderBottom:`1px solid ${T.borderGold}`}}>

          </tr></thead>
          <tbody>
            {char.inventory.map((it,i)=><tr key={it.name} style={{background:i%2?T.bgCard:"none",borderBottom:`1px solid ${T.border}`}}>

            </tr>)}
          </tbody>
        </table>
      </div>}
    </div>
  </div>;
}

const SCHOOL_COLORS = {Evocation:T.ember,Abjuration:T.blue,Illusion:T.purple,Transmutation:T.success,Conjuration:T.warn,Enchantment:T.purple};

function SpellCard({spell,compact=false}) {
  const [open,setOpen]=useState(false);
  const col=SCHOOL_COLORS[spell.school]||T.gold;
  if(compact) return <div onClick={()=>setOpen(o=>!o)} style={{background:T.bgCard,border:`1px solid ${T.border}`,borderLeft:`2px solid ${col}`,padding:"8px 12px",cursor:"pointer",marginBottom:4}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <span style={{fontFamily:F.cinzel,fontSize:11,color:T.parchment}}>{spell.name}</span>
        <span style={{fontFamily:F.sans,fontSize:8,color:col,border:`1px solid ${col}`,padding:"1px 5px",opacity:0.8}}>{spell.school}</span>
        {spell.atk&&<span style={{fontFamily:F.sans,fontSize:8,color:T.ember,border:`1px solid ${T.ember}`,padding:"1px 5px",opacity:0.8}}>ATK</span>}
      </div>
      <div style={{display:"flex",gap:8,alignItems:"center"}}>
        <span style={{fontFamily:F.sans,fontSize:9,color:T.dimText}}>{spell.castTime}</span>
        <span style={{color:T.dimText,fontSize:10}}>{open?"▲":"▼"}</span>
      </div>
    </div>
    {open&&<div style={{marginTop:8,paddingTop:8,borderTop:`1px solid ${T.border}`}}>
      <div style={{display:"flex",gap:12,marginBottom:6,flexWrap:"wrap"}}>
        {[["Range",spell.range],["Duration",spell.duration],["Components",spell.components]].map(([l,v])=>
          <div key={l}><span style={{fontFamily:F.cinzel,fontSize:7,color:T.goldDim,letterSpacing:1}}>{l}: </span><span style={{fontFamily:F.sans,fontSize:10,color:T.parchDim}}>{v}</span></div>
        )}
      </div>
      <p style={{fontFamily:F.fell,fontSize:12,color:T.parchDim,fontStyle:"italic",lineHeight:1.65,margin:0}}>{spell.desc}</p>
    </div>}
  </div>;
  return null;
}

function DiceModal({check,onRoll,onClose}) {
  const [rolling,setRolling]=useState(false);
  const [face,setFace]=useState(20);
  const [result,setResult]=useState(null);
  const handleRoll=()=>{
    setRolling(true);let t=0;
    const iv=setInterval(()=>{setFace(Math.floor(Math.random()*20)+1);t++;
      if(t>14){clearInterval(iv);const r=Math.floor(Math.random()*20)+1;setFace(r);setResult(r);setRolling(false);setTimeout(()=>onRoll(r),700);}
    },60);
  };
  const total=result?result+check.modifier:null;
  const ok=total>=check.dc;
  return <div style={{position:"fixed",inset:0,zIndex:200,background:"rgba(7,6,7,0.88)",display:"flex",alignItems:"center",justifyContent:"center",backdropFilter:"blur(4px)"}} onClick={result?onClose:undefined}>
    <OrnamentBox style={{padding:"32px 40px",width:360,textAlign:"center"}} glow>
      <div style={{fontFamily:F.cinzel,fontSize:10,color:T.goldDim,letterSpacing:4,marginBottom:6,textTransform:"uppercase"}}>Skill Check</div>
      <div style={{fontFamily:F.cinzel,fontSize:22,color:T.gold,marginBottom:4,letterSpacing:1}}>{check.stat}</div>
      <div style={{fontFamily:F.fell,fontSize:13,color:T.parchDim,fontStyle:"italic",marginBottom:20}}>DC {check.dc} · Modifier {check.modifier>=0?`+${check.modifier}`:check.modifier}</div>
      <div onClick={!rolling&&!result?handleRoll:undefined} style={{cursor:result?"default":"pointer",display:"inline-block",marginBottom:16}}>
        <svg width="96" height="96" viewBox="0 0 96 96" fill="none">
          <polygon points="48,4 92,26 92,70 48,92 4,70 4,26"
            stroke={result?(ok?T.success:T.danger):T.gold} strokeWidth="1.5" fill={T.bgDeep}
            style={{filter:result?`drop-shadow(0 0 12px ${ok?T.success:T.danger})`:`drop-shadow(0 0 8px ${T.goldDim})`}}/>
          <polygon points="48,14 80,31 80,65 48,82 16,65 16,31"
            stroke={result?(ok?T.success:T.danger):T.borderGold} strokeWidth="0.5" fill="none" opacity="0.4"/>
          <text x="48" y="58" textAnchor="middle" fontFamily="'Cinzel',serif"
            fontSize={result?32:18} fill={result?(ok?T.success:T.danger):T.gold} fontWeight="400">
            {rolling?face:result?face:"d20"}
          </text>
        </svg>
      </div>
      {result
        ? <div>
            <div style={{fontFamily:F.cinzel,fontSize:18,color:ok?T.success:T.danger,marginBottom:6,letterSpacing:1}}>{result} + {check.modifier} = {total}</div>
            <div style={{fontFamily:F.cinzel,fontSize:12,color:ok?T.success:T.danger,letterSpacing:4,marginBottom:16}}>{ok?"✦ SUCCESS ✦":"✦ FAILURE ✦"}</div>
            <div style={{fontFamily:F.fell,fontSize:11,color:T.dimText,fontStyle:"italic",marginBottom:16}}>Click anywhere to continue</div>
          </div>
        : <GoldBtn onClick={handleRoll} disabled={rolling} style={{padding:"10px 28px"}}>{rolling?"Rolling...":"Roll the Dice"}</GoldBtn>
      }
    </OrnamentBox>
  </div>;
}

          <div style={{fontFamily:F.fell,fontSize:10,color:T.dimText,fontStyle:"italic",lineHeight:1.5,overflow:"hidden",display:"-webkit-box",WebkitLineClamp:2,WebkitBoxOrient:"vertical"}}>{e.content}</div>

        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
          {selected.tags.map(t=><span key={t} style={{fontFamily:F.sans,fontSize:9,color:T.dimText,border:`1px solid ${T.border}`,padding:"2px 9px"}}>{t}</span>)}
        </div>
        <GoldDivider label="Related Entries" style={{margin:"24px 0 14px"}}/>
        {LORE_ENTRIES.filter(e=>e.id!==selected.id&&e.tags.some(t=>selected.tags.includes(t))).slice(0,3).map(e=><div key={e.id} onClick={()=>setSelected(e)} style={{padding:"10px 14px",border:`1px solid ${T.border}`,marginBottom:8,cursor:"pointer",background:T.bgCard,display:"flex",gap:8,alignItems:"flex-start"}}>
          <span style={{fontFamily:F.cinzel,fontSize:7,color:TYPE_COLORS[e.type]||T.gold,border:`1px solid ${TYPE_COLORS[e.type]||T.gold}`,padding:"1px 4px",flexShrink:0,marginTop:2}}>{e.type}</span>
          <div><div style={{fontFamily:F.cinzel,fontSize:11,color:T.parchDim,marginBottom:2}}>{e.subject}</div><div style={{fontFamily:F.fell,fontSize:10,color:T.dimText,fontStyle:"italic"}}>{e.content.slice(0,80)}...</div></div>
        </div>)}

const RACES = ["Human","Elf","Dwarf","Halfling","Gnome","Half-Orc","Tiefling","Dragonborn"];
const CLASSES = [
  {name:"Fighter",icon:"⚔",desc:"Martial mastery. Action Surge, Combat Superiority. Second Wind. No spells."},
  {name:"Wizard",icon:"✦",desc:"Arcane spellcaster. Spell slots, cantrips, ritual casting. Spellbook."},
  {name:"Rogue",icon:"◈",desc:"Sneak Attack, Cunning Action. Expertise. High skill ceiling."},
  {name:"Cleric",icon:"☩",desc:"Divine spellcaster. Channel Divinity. Domain powers. Support or combat."},
  {name:"Paladin",icon:"◇",desc:"Hybrid fighter/caster. Smite, Aura of Protection. Lay on Hands."},
  {name:"Ranger",icon:"⌾",desc:"Wilderness hunter. Favored Enemy, Natural Explorer. Hunter's Mark."},
  {name:"Barbarian",icon:"⬡",desc:"Rage, Reckless Attack, Unarmored Defense. Pure martial force."},
  {name:"Warlock",icon:"⏣",desc:"Eldritch Blast, Pact Magic (few slots, short rest recovery). Patron powers."},
];
const BG_LIST = ["Soldier","Criminal","Sage","Folk Hero","Acolyte","Noble","Outlander","Charlatan"];

function CharCreationScreen({onDone}) {
  const [step,setStep]=useState(0);
  const [name,setName]=useState("");
  const [race,setRace]=useState("");
  const [cls,setCls]=useState("");
  const [bg,setBg]=useState("");
  const [stats,setStats]=useState({STR:15,DEX:14,CON:13,INT:12,WIS:10,CHA:8});
  const STEPS=["Name & Race","Class","Background","Ability Scores","Review"];

  const rollStats=()=>{
    const roll=()=>{const d=[...Array(4)].map(()=>Math.floor(Math.random()*6)+1).sort((a,b)=>b-a);return d[0]+d[1]+d[2];};
    const vals=[roll(),roll(),roll(),roll(),roll(),roll()].sort((a,b)=>b-a);
    const keys=Object.keys(stats);
    const next={};keys.forEach((k,i)=>next[k]=vals[i]);
    setStats(next);
  };

  return <div style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
    {/* Header */}
    <div style={{padding:"16px 28px",borderBottom:`1px solid ${T.border}`,flexShrink:0}}>
      <div style={{fontFamily:F.cinzel,fontSize:18,color:T.gold,letterSpacing:1,marginBottom:12}}>Create Your Character</div>
      {/* Step progress */}
      <div style={{display:"flex",alignItems:"center",gap:0}}>
        {STEPS.map((s,i)=><React.Fragment key={s}>
          <div style={{display:"flex",alignItems:"center",gap:6,cursor:"pointer"}} onClick={()=>i<=step&&setStep(i)}>
            <div style={{width:22,height:22,borderRadius:"50%",background:i<=step?T.gold:T.border,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0}}>
              <span style={{fontFamily:F.cinzel,fontSize:9,color:i<=step?T.bgDeep:T.dimText}}>{i+1}</span>
            </div>
            <span style={{fontFamily:F.cinzel,fontSize:8,color:i===step?T.gold:i<step?T.goldDim:T.dimText,letterSpacing:1,textTransform:"uppercase",whiteSpace:"nowrap"}}>{s}</span>
          </div>
          {i<STEPS.length-1&&<div style={{flex:1,height:1,background:i<step?T.borderGold:T.border,minWidth:20,margin:"0 8px"}}/>}
        </React.Fragment>)}
      </div>
    </div>

    {/* Step content */}
    <div style={{flex:1,overflowY:"auto",padding:"24px 28px"}}>
      {step===0&&<div>
        <div style={{marginBottom:24}}>
          <div style={{fontFamily:F.cinzel,fontSize:9,color:T.goldDim,letterSpacing:2,marginBottom:8,textTransform:"uppercase"}}>Character Name</div>
          <input value={name} onChange={e=>setName(e.target.value)} placeholder="Enter a name..." style={{width:"100%",maxWidth:360,background:T.ink,border:`1px solid ${T.borderGold}`,color:T.parchment,fontFamily:F.fell,fontSize:16,padding:"10px 14px",outline:"none"}}/>
        </div>
        <div>
          <div style={{fontFamily:F.cinzel,fontSize:9,color:T.goldDim,letterSpacing:2,marginBottom:10,textTransform:"uppercase"}}>Race</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(140px,1fr))",gap:10,maxWidth:680}}>
            {RACES.map(r=><div key={r} onClick={()=>setRace(r)} style={{padding:"12px 14px",background:race===r?T.goldFaint:T.bgCard,border:`1px solid ${race===r?T.gold:T.border}`,cursor:"pointer",textAlign:"center",transition:"all 0.12s"}}>
              <div style={{fontFamily:F.cinzel,fontSize:12,color:race===r?T.gold:T.parchDim}}>{r}</div>
            </div>)}
          </div>
        </div>
      </div>}

      {step===1&&<div>
        <div style={{fontFamily:F.cinzel,fontSize:9,color:T.goldDim,letterSpacing:2,marginBottom:14,textTransform:"uppercase"}}>Choose Your Class</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(280px,1fr))",gap:12}}>
          {CLASSES.map(c=><div key={c.name} onClick={()=>setCls(c.name)} style={{padding:"16px 16px",background:cls===c.name?T.goldFaint:T.bgCard,border:`1px solid ${cls===c.name?T.gold:T.border}`,cursor:"pointer",display:"flex",gap:12,alignItems:"flex-start",transition:"all 0.12s",borderLeft:cls===c.name?`3px solid ${T.gold}`:`3px solid transparent`}}>
            <span style={{fontSize:22,lineHeight:1,flexShrink:0,marginTop:2}}>{c.icon}</span>
            <div>
              <div style={{fontFamily:F.cinzel,fontSize:13,color:cls===c.name?T.gold:T.parchment,marginBottom:5}}>{c.name}</div>
              <div style={{fontFamily:F.fell,fontSize:11,color:T.dimText,fontStyle:"italic",lineHeight:1.6}}>{c.desc}</div>
            </div>
          </div>)}
        </div>
      </div>}

      {step===2&&<div>
        <div style={{fontFamily:F.cinzel,fontSize:9,color:T.goldDim,letterSpacing:2,marginBottom:14,textTransform:"uppercase"}}>Background</div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fill,minmax(180px,1fr))",gap:10,maxWidth:680,marginBottom:24}}>
          {BG_LIST.map(b=><div key={b} onClick={()=>setBg(b)} style={{padding:"14px 14px",background:bg===b?T.goldFaint:T.bgCard,border:`1px solid ${bg===b?T.gold:T.border}`,cursor:"pointer",transition:"all 0.12s"}}>
            <div style={{fontFamily:F.cinzel,fontSize:12,color:bg===b?T.gold:T.parchDim}}>{b}</div>
            <div style={{fontFamily:F.sans,fontSize:9,color:T.dimText,marginTop:3}}>+2 skill proficiencies</div>
          </div>)}
        </div>
      </div>}

      {step===3&&<div>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:16}}>
          <div style={{fontFamily:F.cinzel,fontSize:9,color:T.goldDim,letterSpacing:2,textTransform:"uppercase"}}>Ability Scores</div>
          <GoldBtn onClick={rollStats} style={{padding:"6px 14px",fontSize:8}}>⚄ Roll 4d6 Drop Lowest</GoldBtn>
        </div>
        <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:16,maxWidth:440}}>
          {Object.entries(stats).map(([stat,val])=>{
            const mod=Math.floor((val-10)/2);
            return <div key={stat} style={{background:T.bgCard,border:`1px solid ${T.borderGold}`,padding:"14px",textAlign:"center",clipPath:"polygon(0 6px,6px 0,calc(100%-6px) 0,100% 6px,100% calc(100%-6px),calc(100%-6px) 100%,6px 100%,0 calc(100%-6px))"}}>
              <div style={{fontFamily:F.cinzel,fontSize:8,color:T.goldDim,letterSpacing:2,marginBottom:4}}>{stat}</div>
              <div style={{display:"flex",alignItems:"center",justifyContent:"center",gap:6}}>
                <button onClick={()=>setStats(s=>({...s,[stat]:Math.max(8,s[stat]-1)}))} style={{background:"none",border:`1px solid ${T.border}`,color:T.dimText,width:18,height:18,cursor:"pointer",fontSize:11,lineHeight:1}}>−</button>
                <span style={{fontFamily:F.cinzel,fontSize:24,color:T.gold,minWidth:32,textAlign:"center"}}>{val}</span>
                <button onClick={()=>setStats(s=>({...s,[stat]:Math.min(18,s[stat]+1)}))} style={{background:"none",border:`1px solid ${T.border}`,color:T.dimText,width:18,height:18,cursor:"pointer",fontSize:11,lineHeight:1}}>+</button>
              </div>
              <div style={{fontFamily:F.cinzel,fontSize:13,color:T.parchDim,marginTop:2}}>{mod>=0?`+${mod}`:mod}</div>
            </div>;
          })}
        </div>
        <div style={{marginTop:14,fontFamily:F.fell,fontSize:11,color:T.dimText,fontStyle:"italic"}}>Point buy, standard array, or roll. Adjust freely in this mockup.</div>
      </div>}

      {step===4&&<div style={{maxWidth:560}}>
        <div style={{fontFamily:F.cinzel,fontSize:9,color:T.goldDim,letterSpacing:2,marginBottom:20,textTransform:"uppercase"}}>Review Your Character</div>
        <OrnamentBox style={{padding:"22px 24px",marginBottom:20}} glow>
          <div style={{fontFamily:F.cinzel,fontSize:20,color:T.gold,marginBottom:4}}>{name||"(unnamed)"}</div>
          <div style={{fontFamily:F.cinzel,fontSize:10,color:T.dimText,letterSpacing:2,marginBottom:16}}>{race||"—"} · {cls||"—"} · {bg||"—"} · Level 1</div>
          <div style={{display:"grid",gridTemplateColumns:"repeat(6,1fr)",gap:8}}>
            {Object.entries(stats).map(([k,v])=>{const m=Math.floor((v-10)/2);return <div key={k} style={{textAlign:"center"}}>
              <div style={{fontFamily:F.cinzel,fontSize:7,color:T.goldDim,letterSpacing:1}}>{k}</div>
              <div style={{fontFamily:F.cinzel,fontSize:18,color:T.gold}}>{v}</div>
              <div style={{fontFamily:F.cinzel,fontSize:10,color:T.parchDim}}>{m>=0?`+${m}`:m}</div>
            </div>;})}
          </div>
        </OrnamentBox>
        <GoldBtn variant="solid" onClick={onDone} style={{width:"100%",padding:"13px"}}>Begin the Adventure →</GoldBtn>
      </div>}
    </div>

    {/* Footer nav */}
    <div style={{borderTop:`1px solid ${T.border}`,padding:"12px 28px",display:"flex",justifyContent:"space-between",flexShrink:0}}>
      <GoldBtn onClick={()=>setStep(s=>Math.max(0,s-1))} disabled={step===0} style={{padding:"8px 18px",fontSize:9}}>← Back</GoldBtn>
      {step<STEPS.length-1&&<GoldBtn onClick={()=>setStep(s=>s+1)} style={{padding:"8px 18px",fontSize:9}}>Next →</GoldBtn>}
    </div>
  </div>;
}

// ─── ROOT APP ─────────────────────────────────────────────
function App() {
  const [screen,setScreen]=useState("login");
  const [sidebarCollapsed,setSidebarCollapsed]=useState(false);
  const showSidebar=screen!=="login"&&screen!=="creation";
  const showTopNav=screen==="campaigns";

  const handleLogin=()=>setScreen("campaigns");
  const handlePlay=()=>setScreen("session");
  const handleNew=()=>setScreen("creation");
  const handleCreationDone=()=>setScreen("sheet");
  const handleContinue=()=>setScreen("session");

  if(screen==="login") return <div style={{width:"100vw",height:"100vh"}}><LoginScreen onEnter={handleLogin}/></div>;

  return <div style={{width:"100vw",height:"100vh",display:"flex",flexDirection:"column",overflow:"hidden",background:T.bg}}>
    {/* Top nav for pre-game screens */}
    {showTopNav&&<div style={{borderBottom:`1px solid ${T.border}`,padding:"0 24px",display:"flex",alignItems:"center",gap:24,height:44,background:T.bgDeep,flexShrink:0}}>
      <div style={{display:"flex",alignItems:"center",gap:8}}>
        <svg width="16" height="20" viewBox="0 0 16 20" fill="none">
          <rect x="4" y="0" width="8" height="5" rx="0.5" fill={T.gold} opacity="0.9"/>
          <rect x="1" y="6.5" width="14" height="5" rx="0.5" fill={T.gold} opacity="0.6"/>
          <rect x="4" y="13" width="8" height="4" rx="0.5" fill={T.gold} opacity="0.3"/>
        </svg>
        <span style={{fontFamily:F.cinzel,fontSize:12,color:T.gold,letterSpacing:3}}>CAIRN</span>
      </div>
      <div style={{flex:1}}/>
      {["How It Works","Pricing","About"].map(l=><button key={l} style={{background:"none",border:"none",fontFamily:F.cinzel,fontSize:9,color:T.dimText,letterSpacing:2,cursor:"pointer",textTransform:"uppercase",padding:"0 4px"}}>{l}</button>)}
      <GoldBtn onClick={handleLogin} style={{padding:"6px 14px",fontSize:8}}>Sign In</GoldBtn>
    </div>}

    {/* Main layout */}
    <div style={{flex:1,display:"flex",overflow:"hidden"}}>
      {showSidebar&&<Sidebar screen={screen} onNav={setScreen} collapsed={sidebarCollapsed} onToggle={()=>setSidebarCollapsed(v=>!v)}/>}

      {/* Screen content */}
      <div style={{flex:1,display:"flex",overflow:"hidden"}}>
        {screen==="campaigns"&&<CampaignScreen onPlay={handlePlay} onNew={handleNew}/>}
        {screen==="creation"&&<CharCreationScreen onDone={handleCreationDone}/>}
        {screen==="session"&&<SessionScreen/>}
        {screen==="sheet"&&<SheetScreen/>}
        {screen==="spells"&&<SpellScreen/>}
        {screen==="lore"&&<LoreScreen/>}
        {screen==="summary"&&<SummaryScreen onContinue={handleContinue}/>}
      </div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
