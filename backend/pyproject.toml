[project]
name = "cairn"
version = "0.1.0"
description = "AI Dungeon Master"
authors = [
    { name = "Maksym Dombrov", email = "maksymdombrov@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.1",
    "pydantic-settings>=2.14.0",
    "uvicorn[standard]>=0.46.0",
]

[build-system]
requires = ["uv_build>=0.10.2,<0.11.0"]
build-backend = "uv_build"
